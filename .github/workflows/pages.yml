# The landing (packages/site) is the only surface that talks to someone who does
# not have Brío yet, so it lives at a public URL: martinzg16.github.io/personal-md.
# GitHub Pages serves it from a subpath, hence BASE_PATH.
name: Deploy the landing

on:
  push:
    branches: [main]
    paths:
      - "packages/site/**"
      - "packages/brand/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-way to a live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Not `npm ci`, and not `npm install` over the committed lock either.
      # This lockfile carries only darwin-arm64 native binaries — rolldown,
      # oxide, lightningcss — because npm prunes optional platform deps to the
      # machine that wrote it, and it will not add a Linux runner's variants on
      # top of an existing lock (npm/cli#4828). Either way the runner ends up
      # with no Vite to run: Vite 8 is rolldown. Resolving from scratch is the
      # documented way out, and the landing's dependency surface is React, Vite
      # and Tailwind, so the drift it allows is small and visible in one page.
      # --ignore-scripts skips the extension's `wxt prepare`, which needs
      # rolldown too and which the landing does not need.
      - name: Install, resolving native binaries for this runner
        run: |
          rm -f package-lock.json
          npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build:site
        env:
          BASE_PATH: /personal-md/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
