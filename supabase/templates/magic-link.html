<!--
  Brío asks for a six-digit code, not a link, because one of the two places you
  can sign in is a Chrome extension. Supabase sends this template for
  signInWithOtp, and its default body is a link - so a user staring at a field
  marked "000000" would be handed a button instead. {{ .Token }} is the whole
  reason this file exists.
-->
<h2>Your Brío code</h2>

<p style="font-family: ui-monospace, monospace; font-size: 28px; letter-spacing: 0.3em;">
  {{ .Token }}
</p>

<p>It is good for ten minutes. If you did not ask for it, nothing has happened and you can ignore this.</p>
