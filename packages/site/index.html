<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brío — never fill the same form twice</title>
    <meta
      name="description"
      content="Brío keeps what you have already answered — your facts, your stories, the sentences you actually wrote — and fills any form in your own voice. In either language. From one file you own."
    />
    <!--
      THESIS: the only surface of this product that talks to someone who does not
      have it yet, so it does not describe features. It makes three claims a
      sceptic can check, in the order a sceptic asks them: what it does, what it
      refuses to send, and where the file lives.
      OWN-WORLD: bone ground, ink chrome, one orange event. Instrument Serif for
      statements, Instrument Sans for the argument, mono for anything measured.
      STORY: you are tired of retyping the same paragraph. Here is the paragraph
      you already wrote, arriving in someone else's form, with a log of what it
      did and a refusal to guess the rest.
      FIRST VIEWPORT: the claim, the qualifier, one action — and the honest note
      that there is no account and no API key, because that is the objection.
    -->
    <link rel="preload" href="/fonts/instrumentserif-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrumentsans-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
