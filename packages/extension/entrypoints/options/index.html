  <body>
    <!--
      THESIS: your own file, laid out so you can read all of it at once. It
      refuses the settings-form-with-a-wizard-bolted-on shape: five places that
      answer the five questions somebody actually arrives with, in the order they
      get asked, and every field editable where it is shown.
      OWN-WORLD: bone ground, ink chrome, one orange event. No shadows below the
      panel layer, so hierarchy is carried by the face a string is set in, the
      weight of the hairline around it, and the space above it. Instrument Serif
      states, Instrument Sans argues, the mono measures.
      STORY: nothing is written until you say so, and everything written is
      visible. The file is yours; this is a window onto it, not its owner.
      FIRST VIEWPORT: your context — every fact and every answer the file holds,
      grouped and editable, with what is withheld from prompts marked as such.
      FORM: see DESIGN.md at the repository root.
    -->
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
